<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" role="img" aria-labelledby="title desc"><title id="title">双读头90度与180度的空间阶次响应</title><desc id="desc">等幅等权且同一采样时刻时，n阶误差残余为绝对值cos(pi n Delta u)。90度与180度的n为1至6阶响应柱状图。</desc><style>text{font-family:'Noto Sans SC',system-ui,sans-serif;fill:#1d2f43;font-size:25px}.title{font-size:34px;font-weight:700}.small{font-size:22px}.label{font-size:26px;font-weight:600}.grid{stroke:#1d2f43;stroke-opacity:.18;stroke-width:1}.axis{stroke:#1d2f43;stroke-width:2}.teal{fill:#356c72}.gold{fill:#90612c}</style><rect width="960" height="670" fill="#f5f2eb"/><text x="50" y="58" class="title" text-anchor="start">双读头平均：哪些阶次会留下？</text><text x="50" y="104" class="small" text-anchor="start">残余比例 Gₙ = |cos(πnΔu)|；单头幅值归一化为1</text><rect x="570" y="130" width="25" height="25" fill="#356c72"/><text x="607" y="152" class="small" text-anchor="start">90° 间隔</text><rect x="747" y="130" width="25" height="25" fill="#90612c"/><text x="784" y="152" class="small" text-anchor="start">180° 间隔</text><line x1="110" y1="485" x2="900" y2="485" class="grid"/><text x="93" y="493" class="small" text-anchor="end">0</text><line x1="110" y1="360.0" x2="900" y2="360.0" class="grid"/><text x="93" y="368.0" class="small" text-anchor="end">0.5</text><line x1="110" y1="235" x2="900" y2="235" class="grid"/><text x="93" y="243" class="small" text-anchor="end">1</text><rect x="123" y="308.2233047033631" width="32" height="176.7766952966369" fill="#356c72"/><text x="139" y="293.2233047033631" class="small" text-anchor="middle">.707</text><rect x="168" y="485" width="32" height="0" fill="#90612c"/><line x1="170" y1="482" x2="198" y2="482" stroke="#90612c" stroke-width="3"/><text x="184" y="470" class="small" text-anchor="middle">0</text><text x="165" y="528" class="" text-anchor="middle">1</text><rect x="258" y="485" width="32" height="0" fill="#356c72"/><line x1="260" y1="482" x2="288" y2="482" stroke="#356c72" stroke-width="3"/><text x="274" y="470" class="small" text-anchor="middle">0</text><rect x="303" y="235.0" width="32" height="250.0" fill="#90612c"/><text x="319" y="220.0" class="small" text-anchor="middle">1</text><text x="300" y="528" class="" text-anchor="middle">2</text><rect x="393" y="308.22330470336317" width="32" height="176.77669529663686" fill="#356c72"/><text x="409" y="293.22330470336317" class="small" text-anchor="middle">.707</text><rect x="438" y="485" width="32" height="0" fill="#90612c"/><line x1="440" y1="482" x2="468" y2="482" stroke="#90612c" stroke-width="3"/><text x="454" y="470" class="small" text-anchor="middle">0</text><text x="435" y="528" class="" text-anchor="middle">3</text><rect x="528" y="235.0" width="32" height="250.0" fill="#356c72"/><text x="544" y="220.0" class="small" text-anchor="middle">1</text><rect x="573" y="235.0" width="32" height="250.0" fill="#90612c"/><text x="589" y="220.0" class="small" text-anchor="middle">1</text><text x="570" y="528" class="" text-anchor="middle">4</text><rect x="663" y="308.22330470336306" width="32" height="176.77669529663692" fill="#356c72"/><text x="679" y="293.22330470336306" class="small" text-anchor="middle">.707</text><rect x="708" y="485" width="32" height="0" fill="#90612c"/><line x1="710" y1="482" x2="738" y2="482" stroke="#90612c" stroke-width="3"/><text x="724" y="470" class="small" text-anchor="middle">0</text><text x="705" y="528" class="" text-anchor="middle">5</text><rect x="798" y="485" width="32" height="0" fill="#356c72"/><line x1="800" y1="482" x2="828" y2="482" stroke="#356c72" stroke-width="3"/><text x="814" y="470" class="small" text-anchor="middle">0</text><rect x="843" y="235.0" width="32" height="250.0" fill="#90612c"/><text x="859" y="220.0" class="small" text-anchor="middle">1</text><text x="840" y="528" class="" text-anchor="middle">6</text><text x="900" y="565" class="small" text-anchor="end">机械空间阶次 n</text><text x="50" y="609" class="" text-anchor="start">180°消奇次；90°消二次与六次，四次仍保留</text><text x="50" y="650" class="small" text-anchor="start">等幅等权，同采样时刻 · 同一刻度误差的空间平移模型</text></svg>