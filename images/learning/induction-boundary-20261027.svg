<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="title desc"><title id="title">都是线圈，静止目标能不能测要看激励从哪里来</title><desc id="desc">上为被动拾取线圈法拉第定律，下为具有主动交流激励的位置检测概念链。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="570" rx="24" fill="#f7f3e9"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="38" y="48" font-size="27" fill="#203647" text-anchor="start">都是线圈，静止目标能不能测要看激励从哪里来</text><rect x="40" y="110" width="880" height="180" rx="14" fill="#fffdf7" stroke="#cbd4c9" stroke-width="2"/><text x="70" y="152" font-size="25" fill="#203647" text-anchor="start">被动拾取线圈</text><text x="70" y="197" font-size="23" fill="#367b7c" text-anchor="start">外部磁通 Φ(t) 变化</text><path d="M375,190 L465,190" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><text x="490" y="197" font-size="27" fill="#203647" text-anchor="start">v = −N·dΦ/dt</text><text x="70" y="255" font-size="22" fill="#203647" text-anchor="start">线圈与目标相对固定、外场不变 → dΦ/dt = 0 → v = 0</text><rect x="40" y="320" width="880" height="220" rx="14" fill="#fffdf7" stroke="#cbd4c9" stroke-width="2"/><text x="70" y="362" font-size="25" fill="#203647" text-anchor="start">主动电感位置检测</text><rect x="65" y="390" width="240" height="70" rx="9" fill="#e2ece3" stroke="#367b7c" stroke-width="2"/><text x="185" y="433" font-size="23" fill="#203647" text-anchor="middle">交变激励</text><rect x="350" y="390" width="240" height="70" rx="9" fill="#e2ece3" stroke="#367b7c" stroke-width="2"/><text x="470" y="433" font-size="23" fill="#203647" text-anchor="middle">位置相关耦合</text><rect x="655" y="390" width="240" height="70" rx="9" fill="#e2ece3" stroke="#367b7c" stroke-width="2"/><text x="775" y="433" font-size="23" fill="#203647" text-anchor="middle">接收 / 解调</text><path d="M307,425 L347,425" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><path d="M592,425 L652,425" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="510" font-size="22" fill="#203647" text-anchor="start">目标位置固定，内部激励仍变化 → 耦合幅相仍可携带静态位置信息</text></g></svg>