<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">从位置到读数：每一段都有自己的条件</title><desc id="desc">机械位置影响磁场，磁场经传感链转电压后采样，再通过映射估计位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="520" rx="24" fill="#f7f3e9"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="38" y="48" font-size="27" fill="#203647" text-anchor="start">从位置到读数：每一段都有自己的条件</text><rect x="40" y="110" width="270" height="130" rx="14" fill="#fffdf7" stroke="#cbd4c9" stroke-width="2"/><text x="175" y="160" font-size="25" fill="#203647" text-anchor="middle">机械位置 x</text><text x="175" y="201" font-size="20" fill="#367b7c" text-anchor="middle">机构与充磁条件</text><rect x="345" y="110" width="270" height="130" rx="14" fill="#fffdf7" stroke="#cbd4c9" stroke-width="2"/><text x="480" y="160" font-size="25" fill="#203647" text-anchor="middle">磁场分量 Bs(x)</text><text x="480" y="201" font-size="20" fill="#367b7c" text-anchor="middle">气隙、温度、铁件</text><rect x="650" y="110" width="270" height="130" rx="14" fill="#fffdf7" stroke="#cbd4c9" stroke-width="2"/><text x="785" y="160" font-size="25" fill="#203647" text-anchor="middle">传感输出 V(Bs)</text><text x="785" y="201" font-size="20" fill="#367b7c" text-anchor="middle">零点、增益、饱和</text><path d="M310,175 L340,175" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><path d="M615,175 L645,175" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><path d="M785,240 L785,285" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="290" width="270" height="120" rx="14" fill="#fffdf7" stroke="#cbd4c9" stroke-width="2"/><text x="785" y="340" font-size="23" fill="#203647" text-anchor="middle">采样 / ADC / 接口</text><text x="785" y="378" font-size="20" fill="#367b7c" text-anchor="middle">量化、噪声与时间戳</text><path d="M650,350 L615,350" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><rect x="345" y="290" width="270" height="120" rx="14" fill="#fffdf7" stroke="#cbd4c9" stroke-width="2"/><text x="480" y="340" font-size="25" fill="#203647" text-anchor="middle">位置估计 x̂</text><text x="480" y="378" font-size="20" fill="#367b7c" text-anchor="middle">映射需单值且可校验</text><text x="40" y="470" font-size="22" fill="#203647" text-anchor="start">V(B) 线性，不代表 V(x) 线性；数字接口也不代表位置已被唯一解算。</text></g></svg>