<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">GMR与TMR：中间那一层改变了输运机制</title><desc id="desc">金属间隔自旋阀和绝缘隧穿磁结的概念层结构。两磁化层平行，用同向箭头表示。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="560" rx="24" fill="#f7f3e9"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="38" y="48" font-size="27" fill="#203647" text-anchor="start">GMR与TMR：中间那一层改变了输运机制</text><text x="70" y="110" font-size="25" fill="#203647" text-anchor="start">GMR：金属间隔层</text><rect x="70" y="145" width="365" height="66" rx="5" fill="#367b7c" stroke="#367b7c" stroke-width="2"/><text x="300" y="188" font-size="21" fill="#fffdf6" text-anchor="middle">自由磁化层</text><rect x="70" y="225" width="365" height="66" rx="5" fill="#ede0c3" stroke="#ede0c3" stroke-width="2"/><text x="253" y="268" font-size="21" fill="#203647" text-anchor="middle">非磁性金属（示例 Cu）</text><rect x="70" y="305" width="365" height="66" rx="5" fill="#203647" stroke="#203647" stroke-width="2"/><text x="300" y="348" font-size="21" fill="#fffdf6" text-anchor="middle">参考磁化层</text><path d="M90,178 L160,178" fill="none" stroke="#fffdf6" stroke-width="3" marker-end="url(#arrow)"/><path d="M90,338 L160,338" fill="none" stroke="#fffdf6" stroke-width="3" marker-end="url(#arrow)"/><text x="515" y="110" font-size="25" fill="#203647" text-anchor="start">TMR：绝缘隧穿势垒</text><rect x="515" y="145" width="365" height="66" rx="5" fill="#367b7c" stroke="#367b7c" stroke-width="2"/><text x="745" y="188" font-size="21" fill="#fffdf6" text-anchor="middle">自由磁化层</text><rect x="515" y="225" width="365" height="66" rx="5" fill="#ede0c3" stroke="#ede0c3" stroke-width="2"/><text x="698" y="268" font-size="21" fill="#203647" text-anchor="middle">超薄绝缘势垒（示例 MgO）</text><rect x="515" y="305" width="365" height="66" rx="5" fill="#203647" stroke="#203647" stroke-width="2"/><text x="745" y="348" font-size="21" fill="#fffdf6" text-anchor="middle">参考磁化层</text><path d="M535,178 L605,178" fill="none" stroke="#fffdf6" stroke-width="3" marker-end="url(#arrow)"/><path d="M535,338 L605,338" fill="none" stroke="#fffdf6" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="432" font-size="22" fill="#203647" text-anchor="start">上图仅示意两层磁化方向平行的状态；反平行时通常为较高电阻状态。</text><text x="40" y="481" font-size="24" fill="#367b7c" text-anchor="start">GMR：自旋相关散射；TMR：自旋相关隧穿。</text><text x="40" y="526" font-size="21" fill="#203647" text-anchor="start">层结构非按比例；未指定GMR电流几何，也未表达真实工艺与偏置磁路。</text></g></svg>