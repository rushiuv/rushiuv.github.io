<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">磁阻电桥：先定义节点，再推导输出</title><desc id="desc">R1R2为左分支，R3R4为右分支，两中点差分。公式与图中编号一致。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="650" rx="24" fill="#f7f3e9"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="38" y="48" font-size="27" fill="#203647" text-anchor="start">磁阻电桥：先定义节点，再推导输出</text><path d="M285,130 L285,500" fill="none" stroke="#203647" stroke-width="3"/><rect x="244" y="175" width="82" height="90" rx="5" fill="#e3ece3" stroke="#367b7c" stroke-width="2"/><rect x="244" y="350" width="82" height="90" rx="5" fill="#e3ece3" stroke="#367b7c" stroke-width="2"/><path d="M675,130 L675,500" fill="none" stroke="#203647" stroke-width="3"/><rect x="634" y="175" width="82" height="90" rx="5" fill="#e3ece3" stroke="#367b7c" stroke-width="2"/><rect x="634" y="350" width="82" height="90" rx="5" fill="#e3ece3" stroke="#367b7c" stroke-width="2"/><path d="M285,130 L675,130" fill="none" stroke="#203647" stroke-width="3"/><path d="M285,500 L675,500" fill="none" stroke="#203647" stroke-width="3"/><path d="M480,90 L480,130" fill="none" stroke="#203647" stroke-width="3"/><text x="480" y="84" font-size="24" fill="#203647" text-anchor="middle">VE 激励</text><path d="M480,500 L480,525" fill="none" stroke="#203647" stroke-width="3"/><text x="480" y="553" font-size="22" fill="#203647" text-anchor="middle">0 V</text><text x="285" y="230" font-size="26" fill="#203647" text-anchor="middle">R1</text><text x="285" y="407" font-size="26" fill="#203647" text-anchor="middle">R2</text><text x="675" y="230" font-size="26" fill="#203647" text-anchor="middle">R3</text><text x="675" y="407" font-size="26" fill="#203647" text-anchor="middle">R4</text><circle cx="285" cy="305" r="6" fill="#203647"/><text x="218" y="313" font-size="25" fill="#203647" text-anchor="start">A</text><circle cx="675" cy="305" r="6" fill="#203647"/><text x="701" y="313" font-size="25" fill="#203647" text-anchor="start">B</text><path d="M285,305 L380,305" fill="none" stroke="#367b7c" stroke-width="3"/><path d="M675,305 L580,305" fill="none" stroke="#367b7c" stroke-width="3"/><text x="480" y="313" font-size="25" fill="#367b7c" text-anchor="middle">VA − VB</text><text x="38" y="593" font-size="23" fill="#203647" text-anchor="start">VA = VE·R2/(R1+R2)       VB = VE·R4/(R3+R4)</text><text x="38" y="629" font-size="23" fill="#367b7c" text-anchor="start">VD = VA − VB；理想读出端输入阻抗无限大。</text></g></svg>