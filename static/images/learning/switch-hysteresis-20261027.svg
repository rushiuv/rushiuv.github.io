<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">磁开关回差：同一个磁场值，还要知道运动历史</title><desc id="desc">自设正极性低有效开关BOP4mT BRP2mT。箭头分别表示磁场增大和减小。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="600" rx="24" fill="#f7f3e9"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="38" y="48" font-size="27" fill="#203647" text-anchor="start">磁开关回差：同一个磁场值，还要知道运动历史</text><path d="M95,415 L850,415" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><path d="M95,415 L95,105" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="167" font-size="24" fill="#203647" text-anchor="start">H</text><text x="35" y="362" font-size="24" fill="#203647" text-anchor="start">L</text><text x="840" y="455" font-size="22" fill="#203647" text-anchor="start">B / mT</text><text x="36" y="92" font-size="22" fill="#203647" text-anchor="start">OUT</text><path d="M122.000,160.000 L500.000,160.000 L500.000,355.000 L770.000,355.000" stroke="#367b7c" stroke-width="5" fill="none"/><path d="M770.000,355.000 L320.000,355.000 L320.000,160.000 L122.000,160.000" stroke="#b68b43" stroke-width="4" fill="none" stroke-dasharray="8 6"/><path d="M140,105 L140,415" fill="none" stroke="#cbd4c9" stroke-width="3" stroke-dasharray="9 7"/><text x="140" y="452" font-size="22" fill="#203647" text-anchor="middle">0</text><path d="M320,105 L320,415" fill="none" stroke="#cbd4c9" stroke-width="3" stroke-dasharray="9 7"/><text x="320" y="452" font-size="22" fill="#203647" text-anchor="middle">BRP = 2</text><path d="M500,105 L500,415" fill="none" stroke="#cbd4c9" stroke-width="3" stroke-dasharray="9 7"/><text x="500" y="452" font-size="22" fill="#203647" text-anchor="middle">BOP = 4</text><path d="M185.0,160 L275.0,160" fill="none" stroke="#367b7c" stroke-width="3" marker-end="url(#arrow)"/><path d="M725.0,355 L626.0,355" fill="none" stroke="#b68b43" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="500" font-size="23" fill="#367b7c" text-anchor="start">实线：B 增大，到 4 mT 后输出变 L。</text><text x="40" y="536" font-size="23" fill="#b68b43" text-anchor="start">虚线：B 减小，到 2 mT 后输出变 H。</text><text x="40" y="575" font-size="22" fill="#203647" text-anchor="start">本站自设正阈值、低有效开关；回差 2 mT，不代表锁存器。</text></g></svg>