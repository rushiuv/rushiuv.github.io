<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc"><title id="title">闭环磁式电流检测：用反向安匝逼近零磁通</title><desc id="desc">原边正安匝减去补偿安匝，残余驱动补偿电流。概念负反馈框图，不是可直接接线原理图。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><rect width="960" height="580" rx="24" fill="#f7f3e9"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="38" y="48" font-size="27" fill="#203647" text-anchor="start">闭环磁式电流检测：用反向安匝逼近零磁通</text><rect x="45" y="135" width="190" height="120" rx="14" fill="#fffdf7" stroke="#cbd4c9" stroke-width="2"/><text x="140" y="181" font-size="24" fill="#203647" text-anchor="middle">原边电流 Ip</text><text x="140" y="221" font-size="22" fill="#367b7c" text-anchor="middle">Np 匝</text><path d="M235,195 L285,195" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><rect x="285" y="135" width="315" height="120" rx="14" fill="#fffdf7" stroke="#cbd4c9" stroke-width="2"/><text x="443" y="181" font-size="24" fill="#203647" text-anchor="middle">磁芯残余安匝</text><text x="443" y="221" font-size="25" fill="#367b7c" text-anchor="middle">Np·Ip − Ns·Is</text><path d="M600,195 L640,195" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="135" width="270" height="120" rx="14" fill="#fffdf7" stroke="#cbd4c9" stroke-width="2"/><text x="775" y="181" font-size="23" fill="#203647" text-anchor="middle">霍尔 / 误差放大</text><text x="775" y="221" font-size="22" fill="#367b7c" text-anchor="middle">驱动补偿绕组</text><path d="M775,255 L775,350" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><rect x="485" y="350" width="330" height="100" rx="14" fill="#fffdf7" stroke="#cbd4c9" stroke-width="2"/><text x="650" y="389" font-size="24" fill="#203647" text-anchor="middle">补偿电流 Is 经 Ns 匝</text><text x="650" y="427" font-size="21" fill="#367b7c" text-anchor="middle">方向选为抵消原边磁通</text><path d="M485,400 L443,400" fill="none" stroke="#203647" stroke-width="3"/><path d="M443,400 L443,255" fill="none" stroke="#203647" stroke-width="3" marker-end="url(#arrow)"/><text x="40" y="503" font-size="22" fill="#203647" text-anchor="start">稳态且环路未限幅：Np·Ip ≈ Ns·Is；若测量电阻为 Rm，Vout = Is·Rm。</text><text x="40" y="548" font-size="22" fill="#367b7c" text-anchor="start">绕向与电流正方向需配套；量程、磁芯饱和与环路带宽仍需核对。</text></g></svg>