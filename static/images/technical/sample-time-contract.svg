<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" role="img" aria-labelledby="title desc"><title id="title">采样、锁存与使用不是同一时刻</title><desc id="desc">设定时序示意：物理采样、寄存器锁存、处理完成、主机到达与控制使用是不同事件；必须由具体器件定义对应关系。</desc><style>text{font-family:'Noto Sans SC',system-ui,sans-serif;fill:#1d2f43;font-size:25px}.title{font-size:34px;font-weight:700}.small{font-size:22px}.label{font-size:26px;font-weight:600}.grid{stroke:#1d2f43;stroke-opacity:.18;stroke-width:1}.axis{stroke:#1d2f43;stroke-width:2}.teal{fill:#356c72}.gold{fill:#90612c}</style><rect width="960" height="630" fill="#f5f2eb"/><text x="50" y="60" class="title" text-anchor="start">位置属于哪一刻？</text><text x="50" y="103" class="small" text-anchor="start">设定时序示意：不代表任何芯片的内部结构</text><line x1="85" y1="315" x2="885" y2="315" stroke="#1d2f43" stroke-width="3"/><path d="M885 315l-15-8v16z" fill="#1d2f43"/><line x1="100" y1="315" x2="100" y2="192" stroke="#356c72" stroke-width="3"/><circle cx="100" cy="315" r="8" fill="#356c72"/><text x="100" y="175" class="label" text-anchor="middle">物理采样</text><text x="100" y="211" class="" text-anchor="middle">tₛ</text><line x1="285" y1="315" x2="285" y2="360" stroke="#356c72" stroke-width="3"/><circle cx="285" cy="315" r="8" fill="#356c72"/><text x="285" y="390" class="label" text-anchor="middle">寄存器锁存</text><text x="285" y="426" class="" text-anchor="middle">tₗ</text><line x1="480" y1="315" x2="480" y2="192" stroke="#356c72" stroke-width="3"/><circle cx="480" cy="315" r="8" fill="#356c72"/><text x="480" y="175" class="label" text-anchor="middle">处理完成</text><text x="480" y="211" class="" text-anchor="middle">tₚ</text><line x1="665" y1="315" x2="665" y2="360" stroke="#356c72" stroke-width="3"/><circle cx="665" cy="315" r="8" fill="#356c72"/><text x="665" y="390" class="label" text-anchor="middle">主机到达</text><text x="665" y="426" class="" text-anchor="middle">tᵣ</text><line x1="850" y1="315" x2="850" y2="192" stroke="#356c72" stroke-width="3"/><circle cx="850" cy="315" r="8" fill="#356c72"/><text x="850" y="175" class="label" text-anchor="middle">控制使用</text><text x="850" y="211" class="" text-anchor="middle">tᵤ</text><line x1="100" y1="475" x2="850" y2="475" stroke="#90612c" stroke-width="3"/><line x1="100" y1="464" x2="100" y2="486" stroke="#90612c" stroke-width="3"/><line x1="850" y1="464" x2="850" y2="486" stroke="#90612c" stroke-width="3"/><text x="475" y="519" class="" text-anchor="middle">总信息年龄：tᵤ − tₛ</text><text x="50" y="565" class="small" text-anchor="start">锁存沿 ≠ 必然的模拟采样沿；到达时刻 ≠ 数据所属时刻</text><text x="50" y="605" class="small" text-anchor="start">设定示意 · 事件顺序与重叠由具体器件及主控时序定义</text></svg>