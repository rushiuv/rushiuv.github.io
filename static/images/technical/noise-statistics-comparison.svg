180.6" stroke="#1d2f43" stroke-width="3"/><circle cx="405" cy="180.6" r="9" fill="#1d2f43"/><text x="405" y="162.6" class="small" text-anchor="middle">0.126°</text><text x="405" y="457" class="small" text-anchor="middle">2</text><line x1="425" y1="214.8" x2="425" y2="180.6" stroke="#90612c" stroke-width="3"/><line x1="600" y1="420" x2="600" y2="249.0" stroke="#1d2f43" stroke-width="3"/><circle cx="600" cy="249.0" r="9" fill="#1d2f43"/><text x="600" y="231.0" class="small" text-anchor="middle">0.090°</text><text x="600" y="457" class="small" text-anchor="middle">3</text><line x1="620" y1="214.8" x2="620" y2="249.0" stroke="#90612c" stroke-width="3"/><line x1="795" y1="420" x2="795" y2="180.6" stroke="#1d2f43" stroke-width="3"/><circle cx="795" cy="180.6" r="9" fill="#1d2f43"/><text x="795" y="162.6" class="small" text-anchor="middle">0.126°</text><text x="795" y="457" class="small" text-anchor="middle">4</text><line x1="815" y1="214.8" x2="815" y2="180.6" stroke="#90612c" stroke-width="3"/><text x="875" y="490" class="small" text-anchor="end">样本编号</text><text x="58" y="520" class="label" text-anchor="start">均值 μ</text><text x="58" y="561" class="title" text-anchor="start">0.108°</text><text x="370" y="520" class="label" text-anchor="start">总体 σₙ</text><text x="370" y="561" class="title" text-anchor="start">0.018°</text><text x="681" y="520" class="label" text-anchor="start">RMS</text><text x="681" y="561" class="title" text-anchor="start">0.10949°</text><text x="52" y="615" class="" text-anchor="start">RMS² = 均值² + 总体方差</text><text x="52" y="658" class="small" text-anchor="start">设定算例 · N = 4，σₙ采用分母N；赭金线为各点相对均值的偏差</text></svg>