<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">三种封装的引脚功能</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#267c84" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#193647;font-size:23px}.small{font-size:19px;fill:#435d6c}.line{stroke:#267c84;stroke-width:3;fill:none}.box{fill:#eef6f5;stroke:#267c84;stroke-width:2}.accent{fill:#9d582b}.wire{stroke:#193647;stroke-width:3;fill:none}</style><rect width="960" height="440" rx="20" fill="#faf9f5"/><text x="36" y="45" font-weight="700">三种封装的引脚功能</text><text x="35" y="100" class="small">ST3 / SOT-23-3L</text><rect class="box" x="55" y="130" width="235" height="80" rx="8"/><text x="100" y="177">标记面</text><path class="wire" d="M90 210L90 245"/><text x="50" y="290">1 VCC</text><path class="wire" d="M165 210L165 245"/><text x="50" y="320">2 OUT</text><path class="wire" d="M240 210L240 245"/><text x="50" y="350">3 GND</text><text x="345" y="100" class="small">SS3 / SOT23</text><rect class="box" x="365" y="130" width="235" height="80" rx="8"/><text x="410" y="177">标记面</text><path class="wire" d="M400 210L400 245"/><text x="360" y="290">1 VCC</text><path class="wire" d="M475 210L475 245"/><text x="360" y="320">2 OUT</text><path class="wire" d="M550 210L550 245"/><text x="360" y="350">3 GND</text><text x="655" y="100" class="small">TO3 / TO-92S</text><rect class="box" x="675" y="130" width="235" height="80" rx="8"/><text x="720" y="177">标记面</text><path class="wire" d="M710 210L710 245"/><text x="670" y="290">1 VCC</text><path class="wire" d="M785 210L785 245"/><text x="670" y="320">2 GND</text><path class="wire" d="M860 210L860 245"/><text x="670" y="350">3 OUT</text><text x="35" y="412" class="small">功能分组示意，位置不是焊盘坐标；引脚按第4–5页表。</text></svg>