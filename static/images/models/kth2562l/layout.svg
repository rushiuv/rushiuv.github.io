<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title"><title id="title">布局：先照顾供电回路与接收端</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#267c84" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#193647;font-size:23px}.small{font-size:19px;fill:#435d6c}.line{stroke:#267c84;stroke-width:3;fill:none}.box{fill:#eef6f5;stroke:#267c84;stroke-width:2}.accent{fill:#9d582b}.wire{stroke:#193647;stroke-width:3;fill:none}</style><rect width="960" height="480" rx="20" fill="#faf9f5"/><text x="36" y="45" font-weight="700">布局：先照顾供电回路与接收端</text><rect class="box" x="80" y="150" width="290" height="170" rx="8"/><text x="120" y="200">传感器</text><text x="115" y="255">VCC  OUT  GND</text><rect class="box" x="100" y="90" width="175" height="45" rx="8"/><text x="115" y="121" class="small">旁路C1紧邻</text><path class="wire" d="M180 135L180 150"/><rect class="box" x="650" y="150" width="235" height="170" rx="8"/><text x="690" y="205">MCU输入</text><path class="wire" d="M370 235L650 235"/><text x="412" y="215" class="small">短而清楚的输出走线</text><rect class="box" x="650" y="90" width="235" height="45" rx="8"/><text x="673" y="121" class="small">上拉靠近接收端</text><path class="wire" d="M770 135L770 150"/><path class="line" d="M100 355H870" stroke-width="14"/><text x="350" y="395">连续地回路</text><text x="40" y="445" class="small">附近铁、镍零件会改变磁场；示意不代表焊盘尺寸。</text></svg>