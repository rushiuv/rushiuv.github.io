<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title"><title id="title">双极锁存：回到零磁场不自动复位</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#267c84" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#193647;font-size:23px}.small{font-size:19px;fill:#435d6c}.line{stroke:#267c84;stroke-width:3;fill:none}.box{fill:#eef6f5;stroke:#267c84;stroke-width:2}.accent{fill:#9d582b}.wire{stroke:#193647;stroke-width:3;fill:none}</style><rect width="960" height="450" rx="20" fill="#faf9f5"/><text x="36" y="45" font-weight="700">双极锁存：回到零磁场不自动复位</text><text x="40" y="100" class="small">示意采用BOP &gt; 0、BRP &lt; 0的阈值坐标</text><path class="wire" d="M95 315L850 315" marker-end="url(#arrow)"/><text x="850" y="349">B</text><path class="wire" d="M95 315L95 140" marker-end="url(#arrow)"/><text x="40" y="135">OUT</text><path d="M125 170H680V285H825" fill="none" stroke="#267c84" stroke-width="5"/><path d="M825 285H325V170H125" fill="none" stroke="#a95f32" stroke-width="4"/><path class="line" d="M325 150V330M680 150V330" stroke-dasharray="6 6"/><text x="270" y="365">BRP &lt; 0</text><text x="625" y="365">BOP &gt; 0</text><text x="420" y="224">保留上一次状态</text><text x="120" y="150" class="small">高阻，由上拉变高</text><text x="695" y="278" class="small">拉低</text><text x="40" y="414" class="small">过正阈值置低，过负阈值释放；具体磁极对应须按封装核对。</text></svg>