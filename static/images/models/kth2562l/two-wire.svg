<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-labelledby="title"><title id="title">减少线数：在控制器侧检测总电流</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#267c84" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#193647;font-size:23px}.small{font-size:19px;fill:#435d6c}.line{stroke:#267c84;stroke-width:3;fill:none}.box{fill:#eef6f5;stroke:#267c84;stroke-width:2}.accent{fill:#9d582b}.wire{stroke:#193647;stroke-width:3;fill:none}</style><rect width="960" height="490" rx="20" fill="#faf9f5"/><text x="36" y="45" font-weight="700">减少线数：在控制器侧检测总电流</text><rect class="box" x="65" y="150" width="260" height="170" rx="8"/><text x="95" y="195">KTH2562L</text><text x="95" y="240">VCC / OUT</text><text x="95" y="280">GND</text><path class="wire" d="M200 150L200 100"/><path class="wire" d="M200 100L800 100"/><text x="610" y="85">电源正端</text><path class="wire" d="M325 240L425 240"/><path class="wire" d="M425 240L425 145"/><path class="wire" d="M425 145l-8 -8 16 -8 -16 -8 8 -8"/><path class="wire" d="M425 113L425 100"/><text x="455" y="200" class="small">OUT经电阻接VCC</text><path class="wire" d="M200 320L200 370"/><path class="wire" d="M200 370L450 370"/><rect class="box" x="450" y="337" width="160" height="65" rx="8"/><text x="465" y="378">电流检测</text><path class="wire" d="M610 370L800 370"/><text x="680" y="410" class="small">回到电源负端</text><rect class="box" x="670" y="210" width="230" height="65" rx="8"/><text x="695" y="252">控制器判断电流</text><path class="wire" d="M530 337L530 245"/><path class="wire" d="M530 245L670 245" marker-end="url(#arrow)"/><text x="35" y="452" class="small">回传的是总供电电流台阶；需自行设计检测门限、压降与滤波。</text></svg>