<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title"><title id="title">从磁场到开关输出</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#267c84" stroke-width="1.4"/></marker></defs><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#193647;font-size:23px}.small{font-size:19px;fill:#435d6c}.line{stroke:#267c84;stroke-width:3;fill:none}.box{fill:#eef6f5;stroke:#267c84;stroke-width:2}.accent{fill:#9d582b}.wire{stroke:#193647;stroke-width:3;fill:none}</style><rect width="960" height="440" rx="20" fill="#faf9f5"/><text x="36" y="45" font-weight="700">从磁场到开关输出</text><rect class="box" x="35" y="175" width="200" height="85" rx="8"/><text x="50" y="225">霍尔元件</text><path class="wire" d="M235 217L260 217" marker-end="url(#arrow)"/><rect class="box" x="260" y="175" width="200" height="85" rx="8"/><text x="275" y="225">放大 / 补偿</text><path class="wire" d="M460 217L485 217" marker-end="url(#arrow)"/><rect class="box" x="485" y="175" width="200" height="85" rx="8"/><text x="500" y="225">比较 / 锁存</text><path class="wire" d="M685 217L710 217" marker-end="url(#arrow)"/><rect class="box" x="710" y="175" width="200" height="85" rx="8"/><text x="725" y="225">开漏驱动</text><rect class="box" x="230" y="80" width="410" height="55" rx="8"/><text x="270" y="116">斩波稳定与温度补偿</text><path class="wire" d="M440 135L440 175"/><rect class="box" x="675" y="320" width="245" height="55" rx="8"/><text x="695" y="357">限流与反向供电保护</text><path class="wire" d="M810 260L810 320"/><text x="35" y="410" class="small">按手册框图整理功能关系，简化连线，不是晶体管级电路。</text></svg>