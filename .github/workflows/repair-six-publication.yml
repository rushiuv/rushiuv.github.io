name: Repair six original dates and remove decorative images
on:
  push:
    branches: [source]
    paths: ['.github/workflows/repair-six-publication.yml']
permissions:
  contents: write
  actions: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 1
      - name: Correct six original WeChat timestamps and edit media
        run: python3 -u tools/repair_dates_and_decor_once.py
      - name: Validate articles and images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('content/posts')
          dates={
           'wechat-xb-1-rnj2q4bopws0go1-g':'2026-10-20T09:59:53+08:00',
           'wechat-hpmiyoi4wdub2cohexarqa':'2026-10-20T08:08:00+08:00',
           'wechat--qewfmjppojffvnkf9ocuw':'2026-10-20T11:00:00+08:00',
           'wechat-c7ssdymjnsstyrpsejtp-g':'2026-10-19T11:00:00+08:00',
           'wechat-q9cmo5namlgnkuu6ghrqfa':'2026-10-18T11:00:00+08:00',
           'wechat-qzevfb98ussklx-7mxcm-q':'2026-10-16T11:00:00+08:00',
          }
          for slug,date in dates.items():
              c=(base/slug/'index.md').read_text()
              assert f"date: '{date}'" in c
              assert len(c)>2100
              print('DATE_OK',slug,date)
          p=base/'wechat-hpmiyoi4wdub2cohexarqa'
          t=(p/'index.md').read_text()
          assert t.count('images/')==2
          assert len(list((p/'images').iterdir()))==2
          assert 'PART 01' not in t and 'PART 02' not in t
          assert '## 一、' in t and '## 二、' in t and '## 三、' in t
          assert '扫码关注视频号' not in t
          assert '图 2｜GM EV 电机组件细节图' in t
          print('MP_ARTICLE_IMAGES_AND_PARAGRAPHS_OK')
          PY
      - name: Commit repair and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A content/posts/
          git rm tools/repair_dates_and_decor_once.py \
                 .github/workflows/repair-six-publication.yml \
                 .github/workflows/check-wechat-dates-once.yml \
                 .github/workflows/retry-last-wechat-date.yml
          git diff --cached --stat
          git commit -m 'fix: restore six WeChat original publish times and remove decorative article images'
          git push origin HEAD:source
      - name: Request existing Hugo build immediately
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-hugo.yml --ref source
          echo 'HUGO_REBUILD_REQUESTED'
