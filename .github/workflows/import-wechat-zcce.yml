name: Import original WeChat article zCCe5EON
on:
  push:
    branches: [source]
    paths: ['.github/workflows/import-wechat-zcce.yml']
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 1
      - name: Obtain and faithfully import original public article
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4 markdownify Pillow PyYAML lxml
          python3 -u - <<'PY'
          import re, io, os, html, json, hashlib, time
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.parse import urlparse
          import requests, yaml
          from bs4 import BeautifulSoup
          from markdownify import markdownify as md
          from PIL import Image
          
          URL='https://mp.weixin.qq.com/s/zCCe5EONpTZR6ueMpxjBLQ'
          slug='wechat-zcce5eonptzr6uemp xjblq'.replace(' ','')
          expected_title='一块磁铁周围的磁场，究竟是什么样子的？'
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'}
          session=requests.Session()
          response=session.get(URL,headers=headers,timeout=50)
          response.raise_for_status()
          response.encoding='utf-8'
          doc=BeautifulSoup(response.text,'lxml')
          root=doc.select_one('#js_content') or doc.select_one('.rich_media_content')
          meta=doc.select_one('meta[property="og:title"]')
          title=meta.get('content','').strip() if meta else ''
          account=doc.select_one('#js_name')
          account=account.get_text(' ',strip=True) if account else ''
          assert title==expected_title, f'Unexpected article title: {title}'
          assert account=='磁荟', f'Unexpected publishing account {account}'
          assert root is not None, 'Article content missing'
          before_text=root.get_text(' ',strip=True)
          assert 2800 <= len(before_text) <= 70000, f'Article text suspicious: {len(before_text)} chars'
          images=root.select('img')
          assert len(images)==10, f'Expected 10 article illustrations, found {len(images)}'
          
          post=Path('content/posts')/(slug+'/index.md')
          assert not post.exists(), f'Article already exists: {post}'
          images_dir=post.parent/'images'
          images_dir.mkdir(parents=True,exist_ok=True)
          manifest=[]
          total_bytes=0
          for i,tag in enumerate(images,1):
              original=tag.get('data-src') or tag.get('src') or ''
              if original.startswith('//'):
                  original='https:'+original
              u=urlparse(original)
              assert u.scheme=='https' and u.hostname in ('mmbiz.qpic.cn','mmbiz.qlogo.cn'), f'Unexpected image host: {u.hostname}'
              result=session.get(original,headers={**headers,'Referer':URL},timeout=50)
              result.raise_for_status()
              raw=result.content
              assert 800 < len(raw) < 20_000_000, f'Image {i} invalid byte size {len(raw)}'
              total_bytes+=len(raw)
              assert total_bytes < 90_000_000, 'Article image collection too large for this import'
              pil=Image.open(io.BytesIO(raw))
              pil.verify()
              pil=Image.open(io.BytesIO(raw))
              fmt=pil.format
              assert fmt in ('GIF','JPEG','PNG','WEBP'),f'Unknown image format: {fmt}'
              assert pil.width>=80 and pil.height>=60, f'Image {i} unexpectedly small'
              ext={'GIF':'gif','JPEG':'jpg','PNG':'png','WEBP':'webp'}[fmt]
              digest=hashlib.sha256(raw).hexdigest()
              filename=f'{i:03d}-{digest[:10]}.{ext}'
              (images_dir/filename).write_bytes(raw)
              alt=tag.get('alt','') or f'文章插图 {i}'
              tag.attrs={'src':'images/'+filename,'alt':alt}
              manifest.append({'number':i,'file':filename,'format':fmt,'width':pil.width,'height':pil.height,'bytes':len(raw),'sha256':digest})
              print('IMAGE',i,filename,pil.size,len(raw),flush=True)
          
          for tag in list(root.find_all(['script','style','iframe','mpvideo','video','audio','input','button','noscript'])):
              tag.decompose()
          for a in root.find_all('a'):
              href=a.get('href','')
              if href.startswith('javascript:') or href.startswith('//'):
                  a.attrs={}
              elif href.startswith('https://') or href.startswith('http://'):
                  a.attrs={'href':href}
              else:
                  a.attrs={}
          for tag in root.find_all(True):
              if tag.name!='img' and tag.name!='a':
                  tag.attrs={}
          text=md(str(root),heading_style='ATX',bullets='-',strip=['section','div','span','font']).strip()
          text=re.sub(r'\n{3,}','\n\n',text)
          # Keep all ten images in the content, and do not alter article order.
          refs=re.findall(r'images/([0-9]{3}-[a-f0-9]{10}\.(?:jpg|png|gif|webp))',text)
          assert len(refs)==10, f'Markdown lost images: {len(refs)}'
          assert [x['file'] for x in manifest]==refs, f'Markdown changed illustration order'
          # Avoid accidentally publishing a login screen, short snippet or skeletal post.
          plain=BeautifulSoup(str(root),'lxml').get_text(' ',strip=True)
          assert len(plain)>3000 and len(text)>3000
          source_date_match=re.findall(r'(?:(?:ct|publish_time)\s*[:=]\s*["\']?)(\d{10})',response.text)
          source_date=datetime.fromtimestamp(int(source_date_match[0]), ZoneInfo('Asia/Shanghai')).strftime('%Y-%m-%dT%H:%M:%S+08:00') if source_date_match else None
          summary='一块磁铁周围的磁场如何分布：等效磁极模型、轴向距离衰减、位置与方向以及磁路设计。'
          front={'title':title,'date':'2026-10-19T19:54:00+08:00','slug':slug,'description':summary,'source_url':URL,'tags':['磁场','永磁体','磁路设计','磁传感器']}
          if source_date:front['source_date']=source_date
          frontmatter=yaml.safe_dump(front,allow_unicode=True,sort_keys=False,width=1000).strip()
          content='---\n'+frontmatter+'\n---\n\n'+text+'\n'
          assert content.count('images/')==10
          post.write_text(content,encoding='utf-8')
          report={'title':title,'account':account,'original':URL,'source_date':source_date,'bytes_of_text':len(text),'body_chars':len(before_text),'image_count':len(manifest),'images':manifest,'source':'public WeChat original','post':str(post)}
          Path('/tmp/wechat-zcce-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('ARTICLE_READY',json.dumps({k:v for k,v in report.items() if k!='images'},ensure_ascii=False),flush=True)
          print('ARTICLE_PREVIEW_BEGIN',flush=True)
          print(text[:1800],flush=True)
          print('ARTICLE_PREVIEW_END',flush=True)
          
          PY
      - name: Commit article and images without changing the site template
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-wechat-zcce.yml .github/workflows/inspect-wechat-zcce.yml
          git add content/posts/wechat-zcce5eonptzr6uemp xjblq/index.md 2>/dev/null || true
          git add content/posts/wechat-zcce5eonptzr6uempxjblq/
          git diff --cached --stat
          git commit -m 'post: publish complete original magnetic-field WeChat article with 10 local illustrations'
          git push origin HEAD:source
      - name: Explicitly build Hugo with the new article
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-hugo.yml --ref source
          echo 'Requested Hugo source to Pages publishing workflow.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wechat-zcce-import-report
          path: /tmp/wechat-zcce-report.json
          if-no-files-found: ignore
