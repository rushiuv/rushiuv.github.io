name: Import verified WeChat article ABYg9OZbkaFjGJch201cgQ
on:
  push:
    branches: [source]
    paths:
      - '.github/workflows/import-wechat-aby.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: wechat-import-aby
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install article and image readers
        run: pip install curl_cffi beautifulsoup4 pillow
      - name: Fetch and verify original article
        run: python tools/import_wechat_aby20261027.py
      - name: Commit article and local originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- content/posts posts_extra static/images/wx
          if git diff --cached --quiet; then
            echo 'No new article content; fail rather than report publication'
            exit 1
          fi
          git commit -m 'posts: reprint verified WeChat article ABYg9OZbkaFjGJch201cgQ'
          git push origin HEAD:source
      - name: Explicitly trigger Hugo build on source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/rushiuv/rushiuv.github.io/actions/workflows/build-hugo.yml/dispatches" \
            -d '{"ref":"source"}'
          echo 'Hugo build dispatch accepted.'
