name: Verify corrected live dates and clean article
on:
  push:
    branches: [source]
    paths: ['.github/workflows/verify-corrected-six.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source
      - name: Fetch live site and check original article dates
        shell: bash
        run: |
          python3 -m pip install -q requests beautifulsoup4
          python3 -u - <<'PY'
          import requests,time,re
          from bs4 import BeautifulSoup
          s=requests.Session()
          root='https://sensor.fans'
          dates={
           'wechat-xb-1-rnj2q4bopws0go1-g':'2026.10.20 09:59',
           'wechat-hpmiyoi4wdub2cohexarqa':'2026.10.20 08:08',
           'wechat--qewfmjppojffvnkf9ocuw':'2026.10.20 11:00',
           'wechat-c7ssdymjnsstyrpsejtp-g':'2026.10.19 11:00',
           'wechat-q9cmo5namlgnkuu6ghrqfa':'2026.10.18 11:00',
           'wechat-qzevfb98ussklx-7mxcm-q':'2026.10.16 11:00'}
          for attempt in range(1,13):
              try:
                  homepage=s.get(root+'/',timeout=30);homepage.raise_for_status()
                  archives=s.get(root+'/archives/',timeout=30);archives.raise_for_status()
                  assert all('/posts/'+slug+'/' in archives.text for slug in dates)
                  assert '共 327 篇' in archives.text
                  for slug,expected in dates.items():
                      url=root+'/posts/'+slug+'/'
                      r=s.get(url,timeout=30);r.raise_for_status()
                      doc=BeautifulSoup(r.text,'html.parser')
                      t=doc.select_one('article.post time.date')
                      assert t and t.get_text(' ',strip=True)==expected,(slug,t.get_text(' ',strip=True) if t else 'missing',expected)
                      if slug=='wechat-hpmiyoi4wdub2cohexarqa':
                          content=doc.select_one('article.post div.content')
                          assert content
                          images=[x.get('src','') for x in content.find_all('img')]
                          assert len(images)==2,images
                          assert all('/images/' in im or im.startswith('images/') for im in images)
                          assert len(content.find_all('h2'))==3
                          assert not any(x in content.get_text() for x in ['PART 01','PART 02','PART 03','扫码关注视频号'])
                          for im in images:
                              image_url=url+im if im.startswith('images/') else root+im
                              got=s.get(image_url,timeout=30);got.raise_for_status()
                              assert len(got.content)>1000,(image_url,len(got.content))
                          print('CLEAN_MP_ARTICLE_AND_TWO_PHOTOS_OK',flush=True)
                      print('LIVE_CORRECT_DATE',slug,expected,flush=True)
                  assert homepage.text.index('wechat--qewfmjppojffvnkf9ocuw') < homepage.text.index('wechat-xb-1-rnj2q4bopws0go1-g')
                  print('ALL_SIX_TIMES_AND_HOME_ORDER_CONFIRMED',flush=True)
                  break
              except Exception as e:
                  print('LIVE_CHECK_RETRY',attempt,type(e).__name__,str(e)[:240],flush=True)
                  if attempt>=12:raise
                  time.sleep(9)
          PY
      - name: Remove one-off verification workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-corrected-six.yml
          git commit -m 'ci: complete independent live verification of article date fixes'
          git push origin HEAD:source
