name: Restore Baumer EB260F article image
on:
  push:
    paths:
      - .github/workflows/cache-baumer-image.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download and save official image in both site branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin source main
          git worktree add -b baumer-source /tmp/baumer-source origin/source
          python - <<'PY'
          import pathlib, urllib.request, time
          sources=[
            "https://media.baumer.com/mamfile_2200914_720Wx540H_retina.png",
            "https://media.baumer.com/mamfile_2202134_720Wx540H_c.png",
          ]
          content=None
          for url in sources:
            try:
              request=urllib.request.Request(url,headers={
                "User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/125.0.0.0 Safari/537.36",
                "Accept":"image/avif,image/webp,image/apng,image/*,*/*;q=0.8",
                "Referer":"https://www.baumer.com/"
              })
              with urllib.request.urlopen(request, timeout=25) as response:
                data=response.read()
              if data.startswith(b"\x89PNG\r\n\x1a\n") and len(data)>10000:
                content=data
                print("Validated Baumer PNG:",url,"bytes:",len(data))
                break
              print("Not a valid image:",url,len(data))
            except Exception as exc:
              print(type(exc).__name__, str(exc)[:200])
          if content is None:
            raise SystemExit("Official image download failed; no page edits made")
          targets=[
            (pathlib.Path("images/editorial/baumer-eb260f.png"),pathlib.Path("posts/wechat-msjunfybg9l7-obyhurxyq/index.html")),
            (pathlib.Path("/tmp/baumer-source/static/images/editorial/baumer-eb260f.png"),pathlib.Path("/tmp/baumer-source/content/posts/wechat-msjunfybg9l7-obyhurxyq/index.md"))
          ]
          old="https://media.baumer.com/mamfile_2200914_720Wx540H_retina.png"
          new="/images/editorial/baumer-eb260f.png"
          for asset,article in targets:
            html=article.read_text(encoding="utf-8")
            if html.count(old)!=1:
              raise SystemExit("Expected one Baumer image URL in "+str(article)+", found "+str(html.count(old)))
            asset.parent.mkdir(parents=True,exist_ok=True)
            asset.write_bytes(content)
            article.write_text(html.replace(old,new),encoding="utf-8")
          PY
          git add images/editorial/baumer-eb260f.png posts/wechat-msjunfybg9l7-obyhurxyq/index.html
          git commit -m "Host Baumer EB260F product image locally and fix article"
          git -C /tmp/baumer-source add static/images/editorial/baumer-eb260f.png content/posts/wechat-msjunfybg9l7-obyhurxyq/index.md
          git -C /tmp/baumer-source commit -m "Keep Baumer image and article link in Hugo source"
          git push --atomic origin HEAD:refs/heads/main baumer-source:refs/heads/source
