name: Verify six new blog posts live
on:
  push:
    branches: [source]
    paths: ['.github/workflows/verify-six-live.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: source
      - name: Check six live URLs, homepage, archive and images
        shell: bash
        run: |
          python3 -m pip install -q requests beautifulsoup4
          python3 -u - <<'PY'
          import requests,time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          ids=[
           'wechat-xb-1-rnj2q4bopws0go1-g',
           'wechat-hpmiyoi4wdub2cohexarqa',
           'wechat--qewfmjppojffvnkf9ocuw',
           'wechat-c7ssdymjnsstyrpsejtp-g',
           'wechat-q9cmo5namlgnkuu6ghrqfa',
           'wechat-qzevfb98ussklx-7mxcm-q']
          counts=[4,14,9,9,9,9]
          root='https://sensor.fans/'
          s=requests.Session()
          for attempt in range(1,11):
              try:
                  home=s.get(root,timeout=35);home.raise_for_status()
                  archives=s.get(root+'archives/',timeout=35);archives.raise_for_status()
                  hp=home.text;ap=archives.text
                  assert '327 篇' in hp or '327 篇' in ap,(hp.count(' 篇'),ap.count(' 篇'))
                  assert all('/posts/'+slug+'/' in ap for slug in ids),'One or more articles absent from archive'
                  assert all('/posts/'+slug+'/' in hp for slug in ids[1:]),'Five newest posts not on homepage'
                  for slug,n in zip(ids,counts):
                      url=root+'posts/'+slug+'/'
                      r=s.get(url,timeout=35)
                      r.raise_for_status()
                      soup=BeautifulSoup(r.text,'html.parser')
                      title=soup.title.get_text(' ',strip=True)
                      content=soup.select_one('article.post .content')
                      assert content and len(content.get_text(' ',strip=True))>900,(slug,'missing body')
                      pics=[img for img in content.select('img') if 'images/' in (img.get('src') or '')]
                      assert len(pics)==n,(slug,'wrong image count',len(pics),n)
                      for pic in pics:
                          img_url=urljoin(url,pic.get('src'))
                          resp=s.get(img_url,timeout=35)
                          resp.raise_for_status()
                          assert len(resp.content)>500,(img_url,len(resp.content))
                      print('LIVE_OK',slug,'images',len(pics),'title',title,flush=True)
                  print('SIX_POSTS_LIVE_AND_HOME_ARCHIVE_VERIFIED',flush=True)
                  break
              except Exception as e:
                  print('CHECK_RETRY',attempt,type(e).__name__,str(e)[:300],flush=True)
                  if attempt==10:raise
                  time.sleep(10)
          PY
      - name: Remove one-time verification workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-six-live.yml
          git commit -m 'ci: verify six live posts and remove temporary check'
          git push origin HEAD:source
