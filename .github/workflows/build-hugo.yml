name: Build Hugo and deploy GitHub Pages
on:
  push:
    branches: [source]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'assets/**'
      - 'static/**'
      - 'data/**'
      - 'hugo.toml'
      - '.github/workflows/build-hugo.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: hugo-build-publish
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.6'
          extended: true
      - name: Build and validate new article
        shell: bash
        run: |
          set -euo pipefail
          hugo --gc --minify --destination /tmp/rushiuv-site
          touch /tmp/rushiuv-site/.nojekyll
          test -s /tmp/rushiuv-site/index.html
          ARTICLE=/tmp/rushiuv-site/posts/wechat-ezLZtznHzE3-08Xvy1JR5Q
          test -s "$ARTICLE/index.html"
          grep -q '径向外转子' "$ARTICLE/index.html"
          test -s "$ARTICLE/images/001-1f9ce63e66.png"
          echo "Hugo generated article and local image successfully."
      - name: Update static main safely
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE=$(git rev-parse origin/main)
          TMP=$(mktemp -d)
          rmdir "$TMP"
          git worktree add --detach "$TMP" "$BASE"
          cd "$TMP"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rushiuv-site/. .
          mkdir -p .github/workflows
          git show "$BASE":.github/workflows/pages.yml > .github/workflows/pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "Main already contains identical static output."
          else
            git commit -m "deploy: build Hugo from source ${GITHUB_SHA:0:12}"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/rushiuv-site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
