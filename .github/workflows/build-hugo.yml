name: Build Hugo and deploy GitHub Pages
on:
  push:
    branches: [source]
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'assets/**'
      - 'static/**'
      - 'data/**'
      - 'hugo.toml'
      - '.github/workflows/build-hugo.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: hugo-build-publish
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.6'
          extended: true
      - name: Build and validate new article
        shell: bash
        run: |
          set -euo pipefail
          hugo --gc --minify --destination /tmp/rushiuv-site
          touch /tmp/rushiuv-site/.nojekyll
          test -s /tmp/rushiuv-site/index.html
          ARTICLE=$(find /tmp/rushiuv-site/posts -mindepth 1 -maxdepth 1 -type d -iname 'wechat-ezlztznhze3-08xvy1jr5q' -print -quit)
          echo "Resolved Hugo article output: $ARTICLE"
          if [ -z "$ARTICLE" ] || [ ! -s "$ARTICLE/index.html" ]; then
            find /tmp/rushiuv-site/posts -maxdepth 2 -iname '*ezlztzn*' -print
            echo 'Article HTML missing'; exit 1
          fi
          grep -q '径向外转子' "$ARTICLE/index.html"
          mkdir -p "$ARTICLE/images"
          cp -a content/posts/wechat-ezLZtznHzE3-08Xvy1JR5Q/images/. "$ARTICLE/images/"
          test -s "$ARTICLE/images/001-1f9ce63e66.png"
          echo "Page bundle image assets copied into final static output."
          echo "Hugo generated article and local image successfully."
      - name: Update static main safely
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          BASE=$(git rev-parse origin/main)
          TMP=$(mktemp -d)
          rmdir "$TMP"
          git worktree add --detach "$TMP" "$BASE"
          cd "$TMP"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rushiuv-site/. .
          mkdir -p .github/workflows
          git show "$BASE":.github/workflows/pages.yml > .github/workflows/pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "Main already contains identical static output."
          else
            git commit -m "deploy: build Hugo from source ${GITHUB_SHA:0:12}"
            git push origin HEAD:main
          fi
      - name: Trigger existing Pages deploy workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 2 -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'Requested the existing main-branch Pages workflow.'
