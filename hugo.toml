# GitHub Pages：rushiuv.github.io
baseURL = "https://rushiuv.github.io/"
locale = "zh-CN"
defaultContentLanguage = "zh"
title = "如是有为"
hasCJKLanguage = true
capitalizeListTitles = false  # 标签原样显示（ams OSRAM、iC-Haus 不被改大写）
enableRobotsTXT = true

[params]
  description = "如是有为：一个芯片工程师的技术手记，写磁编码器、磁传感器、TMR/霍尔芯片、机器人关节与人形机器人，以及半导体这一行的人和事。"
  # 在 Google Search Console / Bing / 百度站长后台拿到验证码后填这里
  googleVerification = ""
  bingVerification = ""
  baiduVerification = ""
  author = "如是有为"
  subtitle = "芯片 · 传感器 · 机器人"
  sutra = "一切有为法，如梦幻泡影，如露亦如电，应作如是观。"
  sutraFoot = "凡所有相，皆是虚妄。若见诸相非相，即见如来。"

[pagination]
  pagerSize = 20

[permalinks]
  posts = "/posts/:slug/"

[markup.goldmark.renderer]
  unsafe = true      # 公众号原文里夹带少量内联 HTML
  hardWraps = true   # 公众号正文大量单换行，保持原排版

[taxonomies]
  model = "models"
  company = "companies"
  tag = "tags"

[sitemap]
  changeFreq = "weekly"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS"]
