# 部署前把 baseURL 改成真实域名
baseURL = "https://example.com/"
languageCode = "zh-CN"
defaultContentLanguage = "zh"
title = "如是有为"
hasCJKLanguage = true
enableRobotsTXT = true

[params]
  description = "公众号「如是有为」文章存档"
  author = "如是有为"

[pagination]
  pagerSize = 20

[permalinks]
  posts = "/posts/:slug/"

[markup.goldmark.renderer]
  unsafe = true      # 公众号原文里夹带少量内联 HTML
  hardWraps = true   # 公众号正文大量单换行，保持原排版

[taxonomies]

[outputs]
  home = ["HTML", "RSS"]
