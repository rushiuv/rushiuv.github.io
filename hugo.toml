# GitHub Pages：rushiuv.github.io
baseURL = "https://sensor.fans/"
locale = "zh-CN"
defaultContentLanguage = "zh"
title = "如是有为"
hasCJKLanguage = true
capitalizeListTitles = false  # 标签原样显示（ams OSRAM、iC-Haus 不被改大写）
enableRobotsTXT = true

[params]
  description = "如是有为：面向编码器研发与应用的资料站，查芯片型号、官方数据手册与公司产品，阅读磁、光、电感编码器、接口、校准和伺服反馈技术文章。"
  # 在 Google Search Console / Bing / 百度站长后台拿到验证码后填这里
  googleVerification = ""
  bingVerification = ""
  baiduVerification = ""
  author = "如是有为"
  subtitle = "编码器 · 位置反馈 · 研发与应用"
  sutra = "一切有为法，如梦幻泡影，如露亦如电，应作如是观。"
  sutraFoot = "凡所有相，皆是虚妄。若见诸相非相，即见如来。"

[pagination]
  pagerSize = 20

[permalinks]
  posts = "/posts/:slug/"

[markup.goldmark.renderer]
  unsafe = true      # 公众号原文里夹带少量内联 HTML
  hardWraps = true   # 公众号正文大量单换行，保持原排版

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]

[taxonomies]
  model = "models"
  company = "companies"
  tag = "tags"

[sitemap]
  changeFreq = "weekly"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS"]
