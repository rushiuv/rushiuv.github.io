<section class="measurement-tools" aria-label="测量计算工具">
<form class="measurement-tool" id="frequency-tool"><h2>算周期与边沿频率</h2><div class="tool-fields"><label>AB每圈完整周期 P<input name="ppr" type="number" min="1" step="1" value="1024" required></label><label>机械转速 rpm<input name="rpm" type="number" min="0" step="any" value="6000" required></label><label>编码器信号周期数 N<input name="cycles" type="number" min="1" step="1" value="16" required></label></div><p class="tool-note">按AB四倍频计算合计计数事件率；N用于模拟信号输入频率。</p><button type="submit" class="btn">计算</button><output aria-live="polite"></output></form>
<form class="measurement-tool" id="latency-tool"><h2>算匀速信息年龄误差</h2><div class="tool-fields"><label>机械转速 rpm<input name="rpm" type="number" min="0" step="any" value="6000" required></label><label>数据年龄 μs<input name="age" type="number" min="0" step="any" value="10" required></label><label>电机对极数 p<input name="poles" type="number" min="1" step="1" value="7" required></label></div><p class="tool-note">无预测补偿、匀速，输出误差幅值；旋转方向另记。</p><button type="submit" class="btn">计算</button><output aria-live="polite"></output></form>
<form class="measurement-tool" id="statistics-tool"><h2>比较同一列数据的统计量</h2><label>以逗号、空格或换行分隔的数值<textarea name="values" required>1, 2, 3</textarea></label><p class="tool-note">最多100000个有限数值；单位沿用输入，不接受表头或空缺值。</p><button type="submit" class="btn">计算</button><output aria-live="polite"></output></form>
</section><script src="{{ "js/measurement-tools.js" | relURL }}" defer></script>
