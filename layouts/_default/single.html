{{ define "main" }}
<article class="post">
  <h1 class="post-title">{{ .Title }}</h1>
  <div class="meta"><time datetime="{{ .Date.Format "2006-01-02T15:04" }}">{{ .Date.Format "2006-01-02 15:04" }}</time>
  {{ with .Params.original }} · <a href="{{ . }}" rel="noopener" target="_blank">公众号原文</a>{{ end }}</div>
  <div class="content">{{ .Content }}</div>
</article>
<nav class="prevnext">
  {{ with .PrevInSection }}<a class="next" href="{{ .RelPermalink }}">← {{ .Title }}</a>{{ end }}
  {{ with .NextInSection }}<a class="prev" href="{{ .RelPermalink }}">{{ .Title }} →</a>{{ end }}
</nav>
{{ end }}
